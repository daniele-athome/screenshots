name: screenshots
description: Auto-generation of screenshots for Apple and Play Stores using emulators, simulators and real devices. Includes support for multiple locales and framing. Compatible with fastlane.
version: 3.1.2
homepage: https://github.com/mmcc007/screenshots

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  args: ^2.3.0
  yaml: ^3.1.0
  #  resource: ^2.1.7
  path: ^1.8.0
  file: ^7.0.0
  archive: ^4.0.2
  platform: ^3.0.0
  process: ^5.0.2
  meta: ^1.7.0
  frontend_server_client: ^4.0.0
  #  intl: any # ">=0.15.0 <1.0.0"
  #  tool_mobile: ^2.0.0
  build: ^4.0.4
  tool_mobile:
    git: 
      url: https://github.com/daniele-athome/tool_mobile.git
      ref: ng

dev_dependencies:
  build_runner: ^2.1.4
  test: ^1.19.2
  #  test_api: ^0.2.5
  mockito: ^5.4.6
  pedantic: ^1.8.0+1
  quiver: ^3.0.0
#  fake_process_manager: ^0.2.0
  collection: any
  integration_test:
    sdk: flutter
  watcher: ^1.1.2

executables:
  screenshots: main
